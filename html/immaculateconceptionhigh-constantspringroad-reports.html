<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Immaculate Conception High School Portal</title>
    <link rel="stylesheet" href="../css/immaculateconceptionhigh-constantspringroad-style.css">
    <link rel="stylesheet" href="../css/immaculateconceptionhigh-constantspringroad-finance.css">
</head>

<body>

    <header>
        <a href="immaculateconceptionhigh-constantspringroad-index.html" class="site-title">
            <img src="../assets/images/logo.png" alt="Immaculate Conception High School  logo" class="site-logo">
            Immaculate Conception High School Portal
        </a>

        <nav>
            <ul class="nav-links">
                <li><a href="immaculateconceptionhigh_constantspringroad-index.html" class="active">Home</a></li>
                <li><a href="immaculateconceptionhigh_constantspringroad-about.html">About</a></li>
                <li><a href="immaculateconceptionhigh_constantspringroad-contact.html">Contact</a></li>
            </ul>
        </nav>
        
    </header>
<main id="master">

    <section>
        <h1>Student Reporting System</h1>
        <p>Search and view student information, grades and financial records.</p>
    </section>

    <section>
        <h2>Search Student</h2>

        <form id="reportForm">
            <label for="reportSearch">Student Name or ID:</label>

            <input type="search" id="reportSearch" required>

            <button type="submit">Search</button>
        </form>
    </section>

    <section>
        <h2>Student Information</h2>
        <div id="studentInformation"></div>
    </section>

    <section>
        <h2>Academic Report</h2>
        <div id="academicReport"></div>
    </section>

    <section>
        <h2>Financial Statement</h2>
        <div id="financialStatement"></div>
    </section>

    <section>
        <button type="button" id="printReport">
            Print Student Report
        </button>
    </section>

</main>
<script src="../js/immaculateconceptionhigh-constantspringroad-reports.js"></script>
       </body>
</html>
